  }

  .tstat:not(:first-child) { display: none; }
  .tstat-lbl { display: none; }
  .tstat-val { font-size: 13px; }
  .topbar-divider { display: none; }
  .status-label { display: none; }
  .time-display { font-size: 11px; }

  /* Full-screen map */
  #content { flex-direction: column; position: relative; }
  #map-container {
    flex: none;
    width: 100%; height: 100%;
    position: absolute; inset: 0;
    border-right: none;
  }

  /* Heatmap toggle moves up on mobile */
  #heatmap-toggle { top: 8px; right: 8px; font-size: 10px; padding: 4px 9px; }

  /* Filter bar adjusts */
  #filter-bar { top: 8px; left: 8px; gap: 4px; }
  .filter-btn { padding: 4px 9px; font-size: 10px; }

  /* ── BOTTOM SHEET ──────────────────────────────────────── */
  #sidebar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: var(--sheet-height);
    flex: none; width: 100%;
    background: rgba(6, 13, 22, 0.97);
    backdrop-filter: blur(20px) saturate(1.5);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    border-top: 1px solid var(--border-bright);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.6), 0 -1px 0 rgba(0,180,255,0.15);
    z-index: 50;
    transform: translateY(calc(100% - 52px));
    transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
  }
  #sidebar.sheet-open {
    transform: translateY(0);
  }

  /* Sheet drag handle */
  #feed-header {
    cursor: pointer;
    padding: 0 16px;
    height: 52px;
    flex-shrink: 0;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }
  #feed-header::before {
    content: '';
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 4px; border-radius: 2px;
    background: rgba(0,180,255,0.25);
  }

  /* Feed content scrollable */
  #feed-list {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 10px;
  }

  /* Detail panel in mobile sheet */
  #detail-panel { max-height: 0; }
  #detail-panel.open { max-height: 280px; }

  /* Floating alerts toggle button */
  #mobile-alerts-btn {
    display: flex;
  }
}

/* ── FLOATING ALERTS BUTTON (mobile only) ──────────────── */
#mobile-alerts-btn {
  display: none;
  position: absolute;
  bottom: 70px; right: 16px;
  z-index: 200;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1.5px solid var(--border-bright);
  color: var(--accent-cyan);
  cursor: pointer;
  align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 0 rgba(0,180,255,0.4);
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
  flex-direction: column; gap: 1px;
}
#mobile-alerts-btn .btn-count {
  font-size: 9px; font-family: var(--font-mono); color: var(--accent-cyan);
  line-height: 1; letter-spacing: 0.05em; font-weight: 700;
}
#mobile-alerts-btn:active { transform: scale(0.92); }
#mobile-alerts-btn.has-critical {
  border-color: rgba(255,23,68,0.5);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 12px rgba(255,23,68,0.25);
  animation: btn-critical-pulse 2s ease-in-out infinite;
}
@keyframes btn-critical-pulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 0 rgba(255,23,68,0.3); }
  50% { box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 8px rgba(255,23,68,0); }
}

/* Swipe-up arrow in button */
#mobile-alerts-btn .btn-icon {
  font-size: 16px;
  transition: transform 0.3s;
}
#sidebar.sheet-open ~ #mobile-alerts-btn .btn-icon,
.sheet-open-icon { transform: rotate(180deg); }

/* ── SMOOTH TRANSITIONS ────────────────────────────────── */
.detail-chip { transition: background 0.2s, border-color 0.2s; }
.sev-badge { transition: box-shadow 0.25s; }

/* ── Touch ripple on cards ───────────────────────────────── */
.alert-card .ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(0,180,255,0.12);
  transform: scale(0);
  animation: ripple 0.5s ease-out;
  pointer-events: none;
}
@keyframes ripple {
  to { transform: scale(4); opacity: 0; }
}
</style>
</head>
<body>

<script>
// ══════════════════════════════════════════════════════════════
//  DEMO DATA
// ══════════════════════════════════════════════════════════════
const DEMO_ISSUES = {
  "issue_001": { lat: 15.8497, lng: 74.4977, label: "pothole",    severity: 9,  timestamp: Date.now()/1000 - 120,  waveform: [0.1,0.3,0.8,2.4,3.1,2.8,1.2,0.4,0.1,0.2,0.5,1.8,2.2,1.5,0.3] },
  "issue_002": { lat: 15.8550, lng: 74.5050, label: "bump",       severity: 4,  timestamp: Date.now()/1000 - 360,  waveform: [0.2,0.4,0.9,1.1,0.8,0.5,0.3,0.4,0.7,0.9,0.6,0.3] },
  "issue_003": { lat: 15.8430, lng: 74.5120, label: "pothole",    severity: 7,  timestamp: Date.now()/1000 - 900,  waveform: [0.1,0.2,1.0,2.0,3.5,2.8,1.6,0.8,0.3,0.1,0.4,1.2,1.8,1.0,0.2] },
  "issue_004": { lat: 15.8610, lng: 74.4900, label: "crack",      severity: 2,  timestamp: Date.now()/1000 - 1800, waveform: [0.1,0.2,0.3,0.4,0.3,0.2,0.3,0.4,0.3,0.2,0.1] },
  "issue_005": { lat: 15.8510, lng: 74.5200, label: "pothole",    severity: 8,  timestamp: Date.now()/1000 - 2700, waveform: [0.2,0.5,1.6,2.1,0.3,0.1,2.8,3.2,1.4,0.5,0.2] },
  "issue_006": { lat: 15.8460, lng: 74.4850, label: "subsidence", severity: 5,  timestamp: Date.now()/1000 - 3600, waveform: [0.3,0.6,0.9,1.1,1.3,1.2,1.0,0.8,0.6,0.4,0.3] },
  "issue_007": { lat: 15.8580, lng: 74.5080, label: "pothole",    severity: 10, timestamp: Date.now()/1000 - 180,  waveform: [0.1,0.4,1.2,3.5,4.0,3.8,2.2,1.0,0.4,0.1,0.3,1.5,2.8,3.1,1.2] },
  "issue_008": { lat: 15.8490, lng: 74.5150, label: "debris",     severity: 3,  timestamp: Date.now()/1000 - 7200, waveform: [0.2,0.3,0.5,0.4,0.3,0.5,0.4,0.3,0.2,0.3,0.4] },
};

// ══════════════════════════════════════════════════════════════
//  APP STATE
// ══════════════════════════════════════════════════════════════
let issues = {};
let selectedId = null;
let activeFilter = 'all';
let heatmapOn = false;
let mapInstance = null;
let markers = {};
let waveformChart = null;
let demoMode = false;
let sheetOpen = false;
let isMobile = () => window.innerWidth <= 768;

// ══════════════════════════════════════════════════════════════
//  UTILITY
// ══════════════════════════════════════════════════════════════
function getSevClass(sev) {
  if (sev <= 3) return 'sev-low';
  if (sev <= 6) return 'sev-mid';
  return 'sev-high';
}
function getSevColor(sev) {
  if (sev <= 3) return '#00e676';
  if (sev <= 6) return '#ffea00';
  return '#ff1744';
}
function getSevColorRGB(sev) {
  if (sev <= 3) return '0,230,118';
  if (sev <= 6) return '255,234,0';
  return '255,23,68';
}
function getBadgeClass(sev) {
  if (sev <= 3) return 'badge-low';
  if (sev <= 6) return 'badge-mid';
  return 'badge-high';
}
function relativeTime(ts) {
  const diff = Math.floor(Date.now()/1000 - ts);
  if (diff < 60)   return diff + 's ago';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  return Math.floor(diff/3600) + 'h ago';
}
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m + ':' + s;
}
setInterval(updateClock, 1000);
updateClock();

// ══════════════════════════════════════════════════════════════
//  MOBILE SHEET
// ══════════════════════════════════════════════════════════════
function toggleMobileSheet() {
  if (!isMobile()) return;
  sheetOpen = !sheetOpen;
  const sidebar = document.getElementById('sidebar');
  const btn = document.getElementById('mobile-alerts-btn');
  sidebar.classList.toggle('sheet-open', sheetOpen);
  const icon = btn.querySelector('.btn-icon');
  icon.textContent = sheetOpen ? '↓' : '↑';
}

function openMobileSheet() {
  if (!isMobile() || sheetOpen) return;
  sheetOpen = true;
  document.getElementById('sidebar').classList.add('sheet-open');
  document.getElementById('mobile-alerts-btn').querySelector('.btn-icon').textContent = '↓';
}

// Touch swipe for bottom sheet
(function() {
  let startY = 0, startTime = 0;
  const sidebar = document.getElementById('sidebar');

  sidebar.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });

  sidebar.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    const dt = Date.now() - startTime;
    const velocity = Math.abs(dy) / dt;
    if (velocity > 0.3 || Math.abs(dy) > 60) {
      if (dy > 0 && sheetOpen) {
        sheetOpen = false;
        sidebar.classList.remove('sheet-open');
        document.getElementById('mobile-alerts-btn').querySelector('.btn-icon').textContent = '↑';
      } else if (dy < 0 && !sheetOpen) {
        sheetOpen = true;
        sidebar.classList.add('sheet-open');
        document.getElementById('mobile-alerts-btn').querySelector('.btn-icon').textContent = '↓';
      }
    }
  }, { passive: true });
})();

// ══════════════════════════════════════════════════════════════
//  FILTER
// ══════════════════════════════════════════════════════════════
function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.dataset.active = (btn.dataset.filter === f || f === 'all') ? 'true' : 'false';
  });
  renderFeed();
  renderMarkers();
}
function isVisible(issue) {
  if (activeFilter === 'all') return true;
  return getSevClass(issue.severity) === 'sev-' + activeFilter;
}

// ══════════════════════════════════════════════════════════════
//  TOPBAR STATS
// ══════════════════════════════════════════════════════════════
function updateStats() {
  const all = Object.values(issues);
  const critical = all.filter(i => i.severity >= 7).length;
  const avg = all.length ? (all.reduce((a,i) => a + i.severity, 0) / all.length).toFixed(1) : '—';
  document.getElementById('stat-total').textContent = all.length;
  document.getElementById('stat-critical').textContent = critical;
  document.getElementById('stat-avg').textContent = avg;
  document.getElementById('feed-count').textContent = all.length + ' ACTIVE';

  // Mobile button
  const btn = document.getElementById('mobile-alerts-btn');
  document.getElementById('mobile-btn-count').textContent = all.length;
  btn.classList.toggle('has-critical', critical > 0);
}

// ══════════════════════════════════════════════════════════════
//  FEED RENDER
// ══════════════════════════════════════════════════════════════
function renderFeed() {
  const list = document.getElementById('feed-list');
  const sorted = Object.entries(issues)
    .filter(([,i]) => isVisible(i))
    .sort((a,b) => b[1].timestamp - a[1].timestamp);

  if (sorted.length === 0) {
    const msg = Object.keys(issues).length === 0
      ? 'CONNECTING TO FIREBASE...\nAWAITING TELEMETRY DATA'
      : 'NO ISSUES MATCHING FILTER';
    list.innerHTML = `<div class="empty-state shimmer">${msg.replace('\n','<br>')}</div>`;
    return;
  }

  const existing = new Set();
  list.querySelectorAll('.alert-card').forEach(el => existing.add(el.dataset.id));
  const incoming = new Set(sorted.map(([id]) => id));

  list.querySelectorAll('.alert-card').forEach(el => {
    if (!incoming.has(el.dataset.id)) el.remove();
  });

  sorted.forEach(([id, issue], idx) => {
    let card = list.querySelector(`[data-id="${id}"]`);
    const sevCls = getSevClass(issue.severity);
    const badgeCls = getBadgeClass(issue.severity);
    const html = `
      <div class="card-row">
        <div class="card-label">${issue.label.toUpperCase()}</div>
        <div class="sev-badge ${badgeCls}">SEV ${issue.severity}</div>
      </div>
      <div class="card-meta">
        <span>⬡ ${relativeTime(issue.timestamp)}</span>
        <span class="card-coords">${issue.lat.toFixed(4)}, ${issue.lng.toFixed(4)}</span>
      </div>
    `;
    if (!card) {
      card = document.createElement('div');
      card.className = `alert-card ${sevCls}`;
      card.dataset.id = id;
      card.style.animationDelay = (idx * 0.05) + 's';
      card.onclick = (e) => {
        addRipple(card, e);
        selectIssue(id);
      };
      list.prepend(card);
    }
    card.innerHTML = html;
    card.classList.toggle('selected', id === selectedId);
  });
}

// Card ripple
function addRipple(card, e) {
  const rect = card.getBoundingClientRect();
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.left = (e.clientX - rect.left) + 'px';
  r.style.top  = (e.clientY - rect.top) + 'px';
  r.style.width = r.style.height = Math.max(rect.width, rect.height) / 2 + 'px';
  r.style.marginLeft = r.style.marginTop = '-' + (Math.max(rect.width, rect.height) / 4) + 'px';
  card.appendChild(r);
  setTimeout(() => r.remove(), 600);
}

// ══════════════════════════════════════════════════════════════
//  DETAIL PANEL
// ══════════════════════════════════════════════════════════════
function selectIssue(id) {
  selectedId = id;
  const issue = issues[id];
  if (!issue) return;

  document.querySelectorAll('.alert-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });

  const panel = document.getElementById('detail-panel');
  panel.classList.add('open');

  document.getElementById('detail-label').textContent = issue.label.toUpperCase() + ' DETECTED';
  document.getElementById('detail-meta').innerHTML = `
    <div class="detail-chip"><strong>SEV</strong> ${issue.severity}/10</div>
    <div class="detail-chip"><strong>LAT</strong> ${issue.lat.toFixed(5)}</div>
    <div class="detail-chip"><strong>LNG</strong> ${issue.lng.toFixed(5)}</div>
    <div class="detail-chip"><strong>T</strong> ${relativeTime(issue.timestamp)}</div>
  `;

  const bar = document.getElementById('sev-bar');
  bar.style.width = (issue.severity * 10) + '%';
  bar.style.background = `linear-gradient(90deg, ${getSevColor(issue.severity)}aa, ${getSevColor(issue.severity)})`;
  bar.style.boxShadow = issue.severity >= 7 ? '0 0 8px ' + getSevColor(issue.severity) : 'none';
  document.getElementById('sev-bar-val').textContent = issue.severity + '/10';
  document.getElementById('sev-bar-val').style.color = getSevColor(issue.severity);

  renderWaveform(issue.waveform || generateWaveform(issue.severity), issue.severity);

  // Map focus
  if (demoMode) {
    panDemoMap(id, issue);
  } else if (mapInstance) {
    mapInstance.flyTo({
      center: [issue.lng, issue.lat],
      zoom: 16,
      speed: 1.4,
      curve: 1.2,
      essential: true
    });
    // Pulse the marker
    setTimeout(() => pulseMapboxMarker(id, issue.severity), 600);
  }

  // On mobile, open sheet if closed
  if (isMobile() && !sheetOpen) openMobileSheet();
}

function closeDetail() {
  selectedId = null;
  document.getElementById('detail-panel').classList.remove('open');
  document.querySelectorAll('.alert-card').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.demo-marker').forEach(el => el.classList.remove('selected-marker'));
}

// ══════════════════════════════════════════════════════════════
//  WAVEFORM CHART (upgraded)
// ══════════════════════════════════════════════════════════════
function generateWaveform(severity) {
  const len = 16;
  const base = severity / 10;
  return Array.from({ length: len }, (_, i) => {
    const t = i / len;
    return Math.max(0, base * (0.5 + Math.sin(t * Math.PI * 3) * 0.5 + (Math.random() - 0.5) * 0.4));
  });
}

function renderWaveform(wf, severity) {
  if (!wf || wf.length === 0) wf = generateWaveform(severity);
  const ctx = document.getElementById('waveform-chart').getContext('2d');
  if (waveformChart) waveformChart.destroy();

  const color = getSevColor(severity);
  const rgb   = getSevColorRGB(severity);

  // Find peak index
  const maxVal = Math.max(...wf);
  const peakIdx = wf.indexOf(maxVal);
  document.getElementById('waveform-peak').textContent = `PEAK ${maxVal.toFixed(2)}g @ t${peakIdx}`;

  // Gradient fill
  const gradient = ctx.createLinearGradient(0, 0, 0, 100);
  gradient.addColorStop(0,   `rgba(${rgb}, 0.35)`);
  gradient.addColorStop(0.6, `rgba(${rgb}, 0.08)`);
  gradient.addColorStop(1,   `rgba(${rgb}, 0)`);

  // Point colors: highlight peak
  const pointColors = wf.map((v, i) => i === peakIdx ? '#ffffff' : `rgba(${rgb}, 0.7)`);
  const pointRadii  = wf.map((v, i) => i === peakIdx ? 5 : (v > maxVal * 0.7 ? 3 : 2));

  waveformChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: wf.map((_,i) => i),
      datasets: [{
        data: wf,
        borderColor: color,
        borderWidth: 2.5,
        tension: 0.45,
        fill: true,
        backgroundColor: gradient,
        pointRadius: pointRadii,
        pointBackgroundColor: pointColors,
        pointBorderColor: 'transparent',
        pointHoverRadius: 6,
        segment: {
          borderColor: ctx => {
            // neon glow via shadow (CSS only approach via borderColor can't do shadow, but we can vary intensity)
            return color;
          }
        }
      }]
    },
    options: {
      animation: {
        duration: 700,
        easing: 'easeOutQuart',
        onProgress(animation) {
          // subtle scale-in feel
        }
      },
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => `${c.raw.toFixed(2)}g${c.dataIndex === peakIdx ? ' ← PEAK' : ''}`
          },
          backgroundColor: 'rgba(6,13,20,0.95)',
          borderColor: `rgba(${rgb}, 0.4)`,
          borderWidth: 1,
          titleFont: { family: 'Space Mono', size: 10 },
          bodyFont:  { family: 'Space Mono', size: 11 },
          titleColor: `rgba(${rgb}, 0.8)`,
          bodyColor:  '#e8f4ff',
          padding: 8,
          displayColors: false,
        }
      },
      scales: {
        x: { display: false },
        y: {
          grid: { color: `rgba(${rgb}, 0.06)` },
          ticks: {
            font: { family: 'Space Mono', size: 9 },
            color: 'rgba(120,170,210,0.45)',
            maxTicksLimit: 4
          },
          border: { color: 'transparent' }
        }
      }
    }
  });

  // Apply glow via canvas shadow (post-render)
  setTimeout(() => {
    if (waveformChart) {
      const canvas = document.getElementById('waveform-chart');
      const c = canvas.getContext('2d');
      c.save();
      c.shadowColor = color;
      c.shadowBlur = severity >= 7 ? 12 : severity >= 4 ? 6 : 3;
      c.restore();
    }
  }, 50);
}

// ══════════════════════════════════════════════════════════════
//  DEMO MAP
// ══════════════════════════════════════════════════════════════
function lnglatToPercent(lat, lng) {
  const centerLat = 15.852, centerLng = 74.505;
  const rangeLat = 0.035, rangeLng = 0.05;
  const x = 10 + ((lng - centerLng + rangeLng/2) / rangeLng) * 80;
  const y = 10 + ((centerLat + rangeLat/2 - lat) / rangeLat) * 80;
  return { x: Math.max(5, Math.min(95, x)), y: Math.max(5, Math.min(95, y)) };
}

function renderMarkers() {
  if (demoMode) renderDemoMarkers();
  else renderMapboxMarkers();
}

function renderDemoMarkers() {
  const container = document.getElementById('demo-map');
  container.querySelectorAll('.demo-marker').forEach(el => el.remove());

  Object.entries(issues).forEach(([id, issue]) => {
    if (!isVisible(issue)) return;
    const { x, y } = lnglatToPercent(issue.lat, issue.lng);
    const sevCls = getSevClass(issue.severity);
    const marker = document.createElement('div');
    marker.className = `demo-marker ${sevCls}${id === selectedId ? ' selected-marker' : ''}`;
    marker.style.left = x + '%';
    marker.style.top  = y + '%';
    marker.dataset.id = id;
    marker.dataset.x  = x;
    marker.dataset.y  = y;
    marker.style.animationDelay = (Math.random() * 2) + 's';
    marker.innerHTML = `<div class="demo-ring"></div><div class="demo-marker-inner"></div>`;
    marker.onclick = (e) => { e.stopPropagation(); selectIssue(id); };
    container.appendChild(marker);
  });
  if (heatmapOn) drawHeatmap();
}

function panDemoMap(id, issue) {
  const container = document.getElementById('demo-map');
  const marker = container.querySelector(`.demo-marker[data-id="${id}"]`);
  if (!marker) return;

  // Highlight marker
  container.querySelectorAll('.demo-marker').forEach(m => m.classList.remove('selected-marker'));
  marker.classList.add('selected-marker');

  // Pan: translate map so marker is centered
  const mx = parseFloat(marker.dataset.x);
  const my = parseFloat(marker.dataset.y);
  const panX = (50 - mx) * 0.3;
  const panY = (50 - my) * 0.3;
  container.style.setProperty('--pan-x', panX + '%');
  container.style.setProperty('--pan-y', panY + '%');
  container.classList.remove('panning');
  void container.offsetWidth; // force reflow
  container.classList.add('panning');

  // Pulse ring
  const pulse = document.createElement('div');
  pulse.className = 'demo-marker-pulse';
  pulse.style.left = marker.style.left;
  pulse.style.top  = marker.style.top;
  pulse.style.color = getSevColor(issue.severity);
  container.appendChild(pulse);
  setTimeout(() => pulse.remove(), 800);

  setTimeout(() => marker.style.transform = '', 400);
}

// ══════════════════════════════════════════════════════════════
//  MAPBOX INTEGRATION
// ══════════════════════════════════════════════════════════════
function initMapbox() {
  try {
    const script = document.createElement('script');
    script.src = 'https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js';

    script.onload = () => {
      if (!window.mapboxgl) { fallbackToDemo(); return; }

      const cssLink = document.createElement('link');
      cssLink.rel = 'stylesheet';
      cssLink.href = 'https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css';
      document.head.appendChild(cssLink);

      window.mapboxgl.accessToken = MAPBOX_TOKEN;

      mapInstance = new window.mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',
        center: [74.5050, 15.8497],
        zoom: 13,
      });

      mapInstance.on('load', () => {
        demoMode = false;
        document.getElementById('demo-map-container').style.display = 'none';
        document.getElementById('map').style.display = 'block';
        renderMapboxMarkers();
      });
    };

    script.onerror = () => fallbackToDemo();
    document.head.appendChild(script);
  } catch(e) {
    fallbackToDemo();
  }
}

function fallbackToDemo() {
  demoMode = true;
  document.getElementById('map').style.display = 'none';
  document.getElementById('demo-map-container').style.display = 'block';
  renderMarkers();
}

function renderMapboxMarkers() {
  if (!mapInstance) return;
  Object.values(markers).forEach(m => m.remove());
  markers = {};

  Object.entries(issues).forEach(([id, issue]) => {
    if (!isVisible(issue)) return;
    const el = document.createElement('div');
    el.className = `custom-marker ${getSevClass(issue.severity)}`;
    const c = getSevColor(issue.severity);
    el.style.cssText = `background:${c};width:14px;height:14px;border-radius:50%;cursor:pointer;box-shadow:0 0 12px ${c};border:2px solid rgba(0,0,0,0.3);transition:transform 0.2s,box-shadow 0.2s;`;
    el.onclick = () => selectIssue(id);
    el.dataset.id = id;
    markers[id] = new window.mapboxgl.Marker({ element: el })
      .setLngLat([issue.lng, issue.lat])
      .addTo(mapInstance);
  });
}

function pulseMapboxMarker(id, severity) {
  const markerObj = markers[id];
  if (!markerObj) return;
  const el = markerObj.getElement();
  if (!el) return;
  const c = getSevColor(severity);
  el.style.transition = 'none';
  // Three-pulse sequence
  let step = 0;
  const pulse = setInterval(() => {
    if (step % 2 === 0) {
      el.style.transform = 'scale(2.2)';
      el.style.boxShadow = `0 0 0 6px rgba(${getSevColorRGB(severity)}, 0.3), 0 0 20px ${c}`;
    } else {
      el.style.transform = 'scale(1)';
      el.style.boxShadow = `0 0 12px ${c}`;
    }
    step++;
    if (step >= 6) {
      clearInterval(pulse);
      el.style.transition = 'transform 0.2s,box-shadow 0.2s';
    }
  }, 180);
}

function mapZoom(dir) {
  if (mapInstance) mapInstance.setZoom(mapInstance.getZoom() + dir);
}

// ══════════════════════════════════════════════════════════════
//  HEATMAP
// ══════════════════════════════════════════════════════════════
function toggleHeatmap() {
  heatmapOn = !heatmapOn;
  document.getElementById('heatmap-toggle').classList.toggle('active', heatmapOn);
  const canvas = document.getElementById('heatmap-canvas');
  canvas.style.display = heatmapOn ? 'block' : 'none';
  if (heatmapOn) drawHeatmap();
}

function drawHeatmap() {
  const canvas = document.getElementById('heatmap-canvas');
  const container = document.getElementById('map-container');
  canvas.width  = container.offsetWidth;
  canvas.height = container.offsetHeight;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  Object.values(issues).forEach(issue => {
    const { x, y } = lnglatToPercent(issue.lat, issue.lng);
    const px = (x / 100) * canvas.width;
    const py = (y / 100) * canvas.height;
    const r  = 80 + issue.severity * 8;
    const g  = ctx.createRadialGradient(px, py, 0, px, py, r);
    const intensity = issue.severity / 10;
    const rgb = getSevColorRGB(issue.severity);
    g.addColorStop(0,   `rgba(${rgb},${0.5 * intensity})`);
    g.addColorStop(0.5, `rgba(${rgb},${0.18 * intensity})`);
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ══════════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════════
function showToast() {
  const toast = document.getElementById('new-alert-toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ══════════════════════════════════════════════════════════════
//  FIREBASE
// ══════════════════════════════════════════════════════════════
function startFirebase() {
  const { db, ref, onValue } = window.__firebaseReady || {};
  if (!db) { console.error("Firebase not connected"); return; }

  onValue(ref(db, '/alerts'), (snapshot) => {
    const data = snapshot.val() || {};
    const isFirst = Object.keys(issues).length === 0;
    const wasSize = Object.keys(issues).length;
    const transformed = {};
    Object.entries(data).forEach(([id, alert]) => {
      if (!alert.location) return;
      let sev = 3;
      if (alert.severity === "high")   sev = 9;
      else if (alert.severity === "medium") sev = 6;
      transformed[id] = {
        lat: alert.location.lat,
        lng: alert.location.lng,
        label: alert.classification || "unknown",
        severity: sev,
        timestamp: Math.floor(new Date(alert.timestamp_utc).getTime() / 1000)
      };
    });
    issues = transformed;
    const nowSize = Object.keys(issues).length;
    updateStats();
    renderFeed();
    renderMarkers();
    if (!isFirst && nowSize > wasSize) showToast();
    if (heatmapOn) drawHeatmap();
  });
}

function loadDemoData() {
  issues = {};
  const entries = Object.entries(DEMO_ISSUES);
  entries.forEach(([id, issue], i) => {
    setTimeout(() => {
      issues[id] = issue;
      if (i > 0) showToast();
      updateStats();
      renderFeed();
      renderMarkers();
      if (heatmapOn) drawHeatmap();
    }, 300 + i * 400);
  });
  setTimeout(() => {
    const newId = 'issue_new_' + Date.now();
    issues[newId] = {
      lat: 15.8520, lng: 74.5010,
      label: 'pothole', severity: 8,
      timestamp: Date.now()/1000,
      waveform: [0.1,0.3,1.2,3.8,4.2,3.5,1.8,0.7,0.2,0.4,1.5,2.9,2.1,0.8,0.1]
    };
    showToast();
    updateStats();
    renderFeed();
    renderMarkers();
    if (heatmapOn) drawHeatmap();
  }, 12000);
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  initMapbox();

  setTimeout(() => { if (!mapInstance) fallbackToDemo(); }, 2000);

  const tryStart = () => {
    if (window.__firebaseReady) startFirebase();
    else setTimeout(tryStart, 100);
  };
  setTimeout(() => { if (Object.keys(issues).length === 0) loadDemoData(); }, 2000);
  tryStart();

  setInterval(() => renderFeed(), 30000);
  window.addEventListener('resize', () => {
    if (heatmapOn) drawHeatmap();
    // Re-evaluate mobile layout on resize
    if (!isMobile()) {
      document.getElementById('sidebar').classList.remove('sheet-open');
      sheetOpen = false;
    }
  });
});
</script>
